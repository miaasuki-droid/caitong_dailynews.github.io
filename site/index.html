<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>今日全球快讯</title>
  <meta name="description" content="财通固收早晚报快讯筛选工具" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <p class="eyebrow">MARKET LIVE</p>
        <h1>今日全球快讯</h1>
        <p class="subtitle">
          自动整理
          <a href="https://wallstreetcn.com/live/global" target="_blank" rel="noreferrer">华尔街见闻 · 全球快讯</a>
        </p>
      </div>
      <div class="status-wrap">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">读取数据中</span>
      </div>
    </div>
  </header>

  <main class="page">
    <section class="summary" aria-label="今日摘要">
      <div class="date-block">
        <span class="label">日期</span>
        <strong id="dateText">—</strong>
      </div>
      <div class="summary-grid">
        <div class="metric">
          <span>快讯</span>
          <strong id="totalCount">—</strong>
        </div>
        <div class="metric">
          <span>重要</span>
          <strong id="importantCount">—</strong>
        </div>
        <div class="metric">
          <span>非常重要</span>
          <strong id="criticalCount">—</strong>
        </div>
      </div>
      <div class="update-block">
        <span class="label">数据生成</span>
        <strong id="updatedText">—</strong>
      </div>
    </section>

    <section class="controls" aria-label="筛选">
      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索关键词，例如：美联储、国债、人民币" />
      </div>

      <div class="filters" role="group" aria-label="重要性筛选">
        <button class="filter active" data-filter="all">全部</button>
        <button class="filter" data-filter="important">重要以上</button>
        <button class="filter" data-filter="critical">非常重要</button>
      </div>
    </section>

    <section id="selectionWorkbench" class="selection-workbench collapsed" aria-label="早晚报生成">
      <button id="selectionDrawerToggle" class="selection-drawer-toggle" type="button" aria-expanded="false">
        <span class="drawer-arrow" aria-hidden="true">⌃</span>
        <span id="drawerSummary">已选 0 条 · 提交</span>
      </button>

      <div class="selection-workbench-body">
        <div class="selection-status">
          <span class="label">早晚报素材</span>
          <strong id="selectedCount">已选 0 条</strong>
          <span id="selectedBreakdown" class="selection-breakdown">国内 0 · 国外 0</span>
        </div>

        <div class="edition-control">
          <span class="label">报告类型</span>
          <div class="edition-toggle" role="group" aria-label="报告类型">
            <button id="morningButton" class="edition-button" data-edition="morning" type="button">早报</button>
            <button id="eveningButton" class="edition-button" data-edition="evening" type="button">晚报</button>
          </div>
          <span class="edition-note">北京时间 14:00 前默认早报，14:00 起默认晚报</span>
        </div>

        <div class="selection-actions">
          <button id="clearSelectionButton" class="secondary-button" type="button">清空选择</button>
          <button id="generateReportButton" class="action-button primary-action" type="button" disabled>提交并生成报告</button>
        </div>
      </div>
    </section>

    <section class="result-meta">
      <span id="resultCount">—</span>
      <span class="separator">·</span>
      <span>北京时间</span>
      <span class="separator">·</span>
      <span>点击每条快讯右侧“国内 / 国外”加入报告</span>
    </section>

    <section id="timeline" class="timeline" aria-live="polite"></section>

    <section id="emptyState" class="empty-state" hidden>
      <h2>没有匹配内容</h2>
      <p>换一个关键词或筛选条件。</p>
    </section>

    <section id="errorState" class="error-state" hidden>
      <h2>暂时没有拿到数据</h2>
      <p id="errorText">稍后刷新页面再试。</p>
    </section>

    <section id="reportPanel" class="report-panel" hidden>
      <div class="report-heading">
        <div>
          <span class="label">生成结果</span>
          <h2 id="reportHeadingText">早晚报文本</h2>
        </div>
        <button id="copyReportButton" class="action-button" type="button">一键复制报告</button>
      </div>
      <textarea id="reportText" class="report-text" spellcheck="false" aria-label="生成的早晚报文本"></textarea>
      <p class="report-hint">可以直接在这里手动修改；“一键复制报告”会复制修改后的最终文本。</p>
    </section>
  </main>

  <footer>
    <p>
      本页仅做个人信息整理。内容版权归原始来源所有；点击单条快讯可回到原页面。
    </p>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
