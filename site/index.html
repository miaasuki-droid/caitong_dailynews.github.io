<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>今日全球快讯</title>
  <meta name="description" content="财通固收早晚报快讯筛选工具" />
  <link rel="stylesheet" href="./styles.css?v=512" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner compact-head">
      <div>
        <p class="eyebrow">MARKET LIVE</p>
        <h1>今日全球快讯</h1>
        <p class="subtitle">自动整理 <a href="https://wallstreetcn.com/live/global" target="_blank" rel="noreferrer">华尔街见闻 · 全球快讯</a></p>
      </div>
      <div class="status-wrap">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="statusText">读取数据中</span>
      </div>
    </div>
  </header>

  <main class="page first-page">
    <section class="simple-toolbar">
      <div class="updated-card">
        <span class="label">更新时间</span>
        <strong id="updatedText">—</strong>
      </div>

      <div class="search-box">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="m21 21-4.4-4.4m2.4-5.1a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/>
        </svg>
        <input id="searchInput" type="search" placeholder="搜索关键词，例如：美联储、国债、人民币" />
      </div>

      <div class="cloud-box">
        <span class="label">共享工作区</span>
        <div class="cloud-row">
          <div class="cloud-status-stack">
            <strong id="workspaceModeLabel" class="workspace-mode-label">财通模式</strong>
            <span id="cloudStatus" class="cloud-status">正在连接…</span>
          </div>
          <button id="cloudReconnectButton" class="cloud-reconnect-button" type="button">切换入口</button>
        </div>
      </div>
    </section>

    <section class="filter-shell" aria-label="新闻筛选">
      <div class="news-view-tabs" role="tablist" aria-label="新闻栏">
        <button id="rawNewsTab" class="news-view-tab" type="button" data-view="raw" role="tab" aria-selected="false">
          原始新闻 <span id="rawNewsCount" class="tab-count">0</span>
        </button>
        <button id="filteredNewsTab" class="news-view-tab active" type="button" data-view="filtered" role="tab" aria-selected="true">
          筛选后新闻 <span id="filteredNewsCount" class="tab-count">0</span>
        </button>
      </div>

      <div class="filter-controls">
        <label class="threshold-control" for="minLengthInput">
          <span class="filter-label">最小字数</span>
          <div class="threshold-input-wrap">
            <input id="minLengthInput" type="number" inputmode="numeric" min="0" max="10000" step="1" value="10" />
            <span>字</span>
          </div>
          <small>少于该字数的新闻不显示</small>
        </label>

        <label class="blocked-terms-control" for="blockedTermsInput">
          <span class="filter-label">筛选词</span>
          <textarea id="blockedTermsInput" rows="3" placeholder="一个词一行；包含任一词的新闻不进入“筛选后新闻”"></textarea>
        </label>
      </div>
    </section>

    <section id="selectionWorkbench" class="selection-workbench collapsed" aria-label="早晚报生成">
      <button id="selectionDrawerToggle" class="selection-drawer-toggle" type="button" aria-expanded="false">
        <span class="drawer-arrow" aria-hidden="true">⌃</span>
        <span id="drawerSummary">已选 0 条 · 提交</span>
      </button>
      <div class="selection-workbench-body">
        <div class="selection-status">
          <span id="reportMaterialLabel" class="label">早晚报素材</span>
          <strong id="selectedCount">已选 0 条</strong>
          <span id="selectedBreakdown" class="selection-breakdown">国内 0 · 国外 0 · 自选 0</span>
          <button id="clearManualButton" class="clear-manual-button" type="button">清空自选</button>
        </div>
        <div id="editionControl" class="edition-control">
          <span class="label">报告类型</span>
          <div class="edition-toggle" role="group" aria-label="报告类型">
            <button id="morningButton" class="edition-button" data-edition="morning" type="button">早报</button>
            <button id="eveningButton" class="edition-button" data-edition="evening" type="button">晚报</button>
          </div>
          <span class="edition-note">北京时间 02:00–13:59 默认早报，14:00–次日01:59 默认晚报</span>
        </div>
        <div class="selection-actions">
          <button id="clearSelectionButton" class="secondary-button" type="button">清空选择</button>
          <button id="generateReportButton" class="action-button primary-action" type="button" disabled>进入整理页</button>
        </div>
      </div>
    </section>

    <section id="timeline" class="timeline" aria-live="polite"></section>

    <section id="emptyState" class="empty-state" hidden>
      <h2>没有匹配内容</h2>
      <p>调整搜索词、最小字数或筛选词。</p>
    </section>

    <section id="errorState" class="error-state" hidden>
      <h2>暂时没有拿到数据</h2>
      <p id="errorText">稍后刷新页面再试。</p>
    </section>
  </main>

  <footer><p>本页仅做个人信息整理。内容版权归原始来源所有；点击单条快讯可回到原页面。</p></footer>

  <div id="selectedNavigator" class="selected-navigator" hidden aria-label="已选新闻导航">
    <button id="previousSelectedButton" class="selected-nav-button" type="button" title="上一条已选新闻">
      <span class="selected-nav-arrow">↑</span>
      <span class="selected-nav-label">上一个已选</span>
    </button>
    <div id="selectedNavPosition" class="selected-nav-position">0 / 0</div>
    <button id="nextSelectedButton" class="selected-nav-button" type="button" title="下一条已选新闻">
      <span class="selected-nav-arrow">↓</span>
      <span class="selected-nav-label">下一个已选</span>
    </button>
  </div>

  <script src="./cloud-config.js?v=510"></script>
  <script src="./cloud.js?v=510"></script>
  <script src="./app.js?v=510"></script>
</body>
</html>
