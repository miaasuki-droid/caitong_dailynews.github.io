<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>整理早晚报</title>
  <link rel="stylesheet" href="./styles.css?v=500" />
</head>
<body class="review-body">
  <header class="review-topbar">
    <div class="review-topbar-inner">
      <a class="back-link" href="./index.html">← 返回选新闻</a>
      <div>
        <p class="eyebrow dark-eyebrow">REPORT BUILDER</p>
        <h1 class="review-title">整理早晚报</h1>
      </div>
      <div class="review-header-actions">
        <span id="reviewCloudStatus" class="review-account-badge">云端：正在连接…</span>
        <button id="newDomesticGroupButton" class="secondary-button">+ 国内组</button>
        <button id="newForeignGroupButton" class="secondary-button">+ 国外组</button>
      </div>
    </div>
  </header>

  <main class="review-page">
    <section class="review-help">
      <div>
        <strong id="reviewCount">—</strong>
        <span>点击每条新闻或组左上角“...”进行上移、下移、分组或删除。手机端正文会自动缩略，点正文可展开。</span>
      </div>
      <div class="review-actions-top">
        <button id="clearGroupsButton" class="secondary-button">清空分组</button>
        <button id="resetGroupsButton" class="secondary-button">分组重置</button>
        <button id="previewButton" class="action-button primary-action">生成文本</button>
      </div>
    </section>

    <section class="manual-add-panel">
      <div class="manual-add-heading">
        <div>
          <span class="label">额外素材</span>
          <h2>手动添加新闻</h2>
        </div>
        <span class="manual-add-note">整段粘贴即可；生成报告时同一条新闻内部会自动合并为一个段落。</span>
      </div>
      <textarea id="manualNewsInput" class="manual-news-input" placeholder="把额外新闻粘贴到这里……" spellcheck="false"></textarea>
      <div class="manual-add-actions">
        <button id="addManualDomesticButton" class="secondary-button" type="button">添加到国内</button>
        <button id="addManualForeignButton" class="action-button" type="button">添加到国外</button>
      </div>
    </section>

    <section class="review-columns">
      <div class="review-column">
        <div class="column-title"><h2>国内新闻</h2><span id="domesticCount">0 条</span></div>
        <div id="domesticBoard" class="board" data-category="domestic"></div>
      </div>
      <div class="review-column">
        <div class="column-title"><h2>国外新闻</h2><span id="foreignCount">0 条</span></div>
        <div id="foreignBoard" class="board" data-category="foreign"></div>
      </div>
    </section>

    <section id="reportPanel" class="report-panel review-report-panel" hidden>
      <div class="report-heading">
        <div>
          <span class="label">最终文本</span>
          <h2 id="reportHeadingText">早晚报</h2>
        </div>
        <button id="copyReportButton" class="action-button" type="button">一键复制</button>
      </div>
      <textarea id="reportText" class="report-text" spellcheck="false"></textarea>
      <p id="reportHint" class="report-hint">同一条新闻内部不留空行；不同新闻之间保留一个空行。组标题使用（数字），组内新闻使用①②③重新编号。</p>
    </section>

    <section id="reviewError" class="error-state" hidden>
      <h2>没有可整理的新闻</h2>
      <p>请返回上一页至少选择一条新闻，或在上方手动添加。</p>
    </section>
  </main>

  <div id="globalNodeMenu" class="global-node-menu" hidden>
    <div class="global-node-menu-grid">
      <button type="button" class="global-menu-action" data-action="move-up">上移</button>
      <button type="button" class="global-menu-action" data-action="move-top">移到最上</button>
      <button type="button" class="global-menu-action" data-action="move-down">下移</button>
      <button type="button" class="global-menu-action" data-action="move-bottom">移到最下</button>
    </div>
    <div id="globalNodeMenuExtra" class="global-node-menu-extra"></div>
  </div>

  <div id="groupPickerOverlay" class="group-picker-overlay" hidden>
    <section class="group-picker-modal" role="dialog" aria-modal="true" aria-labelledby="groupPickerTitle">
      <div class="group-picker-head">
        <h2 id="groupPickerTitle">选择分组</h2>
        <button id="closeGroupPickerButton" class="icon-close-button" type="button" aria-label="关闭">×</button>
      </div>
      <div id="groupPickerList" class="group-picker-list"></div>
      <button id="createGroupForItemButton" class="secondary-button group-picker-create" type="button">+ 新建组并放入</button>
    </section>
  </div>

  <script src="./cloud-config.js?v=500"></script>
  <script src="./cloud.js?v=500"></script>
  <script src="./review.js?v=500"></script>
</body>
</html>
