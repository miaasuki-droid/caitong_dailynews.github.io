name: Manual Refresh WSCN News

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore rolling news cache
        uses: actions/cache@v4
        with:
          path: cache/news_history.json
          key: wscn-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wscn-history-${{ runner.os }}-

      - name: Fetch latest WSCN news
        run: python scripts/fetch_wscn.py

      - name: Persist refreshed news in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json
          if [ -f cache/news_history.json ]; then
            git add -f cache/news_history.json
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore: manual news refresh [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
