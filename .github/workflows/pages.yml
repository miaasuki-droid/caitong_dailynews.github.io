name: Refresh WSCN Today

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # GitHub Actions cron 使用 UTC。
    # 北京时间每天 07:00、07:30、08:00 抓取一次当天全部新闻。
    - cron: "0,30 23 * * *"
    - cron: "0 0 * * *"

    # 北京时间每天 19:00、19:30、20:00 抓取一次当天全部新闻。
    - cron: "0,30 11 * * *"
    - cron: "0 12 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Fetch today's WSCN live news
        run: python scripts/fetch_wscn.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
