name: Refresh WSCN Today

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    # GitHub Actions cron 使用 UTC。
    # 北京时间每天 06:30、07:00、07:30 抓取一次当天全部新闻。
    - cron: "30 22 * * *"
    - cron: "0,30 23 * * *"

    # 北京时间每天 18:30、19:00、19:30 抓取一次当天全部新闻。
    - cron: "30 10 * * *"
    - cron: "0,30 11 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Restore rolling news cache
        uses: actions/cache@v4
        with:
          path: cache/news_history.json
          key: wscn-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            wscn-history-${{ runner.os }}-

      - name: Fetch last 24 hours of WSCN live news
        run: python scripts/fetch_wscn.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
